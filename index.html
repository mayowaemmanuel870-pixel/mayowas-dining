<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayowa's Dining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    :root {
      --cream: #faf6ef;
      --line: #e7e0d3;
    }
  </style>
  <body class="bg-[#FAF6EF] text-slate-900 antialiased">
    <header
      class="sticky top-0 z-50 bg-[var(--cream)]/90 backdrop-blur border-b border-[var(--line)] flex items-center justify-between px-8 py-5"
    >
      <div class="flex items-center gap-2 font-serif text-2xl font-bold">
        🍴 Mayowa's Dining
      </div>

      <nav class="flex gap-8 text-sm font-medium">
        <a href="index.html" class="border-b-2 border-orange-500 pb-1">Home</a>
        <a href="our-story.html">Our Story</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
      </nav>
      
      <a href="contact.html" class="bg-orange-600 text-white text-sm font-semibold px-5 py-2 rounded-full hover:bg-orange-700 transition-colors">
        Book a Table
      </a>
    </header>

    <section class="min-h-screen bg-[#FAF6EF] max-w-6xl mx-auto px-6 py-20">
      <div class="grid md:grid-cols-2 gap-12 items-center">
        
        <div>
          <h1
            class="text-slate-900 text-5xl font-serif font-bold leading-tight mb-4"
          >
            Savor the Art of Fine Dining
          </h1>

          <p class="text-slate-600 text-lg mb-6">
            Experience an exquisite blend of seasonal flavors and artisanal
            craft in the heart of the city. Every plate tells a story of
            heritage and innovation.
          </p>

          <div class="flex gap-4">
            <a
              href="menu.html"
              class="bg-green-800 text-white font-semibold px-6 py-3 rounded-full hover:bg-green-900 transition-colors"
            >
              Explore Menu
            </a>

            <a
              href="our-story.html"
              class="bg-white border border-slate-300 text-slate-900 font-semibold px-6 py-3 rounded-full hover:bg-slate-50 transition-colors"
            >
              Discover Our Story
            </a>
          </div>
        </div>

        <div>
          <div class="w-full h-[500px] bg-gradient-to-br from-orange-200 to-orange-100 rounded-full flex items-center justify-center">
            <span class="text-slate-400 text-sm">[ Featured Image ]</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
